[project]
name = "beehive-docs"
version = "0.1.0"
description = "Documentation site for BeeHive — a flexible open electronics platform for research equipment."
requires-python = ">=3.12"
dependencies = []

# The documentation site is built with Zensical (the successor to MkDocs by the
# Material for MkDocs team). Tasks are run with poethepoet, e.g. `uv run poe
# serve`. The `gen` task regenerates every auto-built page (the Ingredients
# catalogue) from the YAML sources in ./data, so the site always mirrors the
# single source of truth; `serve` and `build` run it first.
[dependency-groups]
docs = [
    "zensical>=0.0.46",
    "pyyaml>=6",
    "poethepoet>=0.29",
]

[tool.poe.tasks]
sync = { cmd = "python scripts/sync_kitspace.py", help = "Vendor board BOMs from the BeeHive repo's kitspace.yaml into data/kitspace/" }
gen = { cmd = "python scripts/build_ingredients.py", help = "Regenerate the Ingredients catalogue from data/ingredients/*.yaml" }
serve = { cmd = "zensical serve", deps = ["gen"], help = "Serve the docs locally with live reload" }
build = { cmd = "zensical build", deps = ["gen"], help = "Build the static site into ./site" }

[tool.uv]
default-groups = ["docs"]
