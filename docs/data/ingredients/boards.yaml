# BeeHive Ingredients — single source of truth for the board catalogue.
#
# docs/scripts/build_ingredients.py reads every docs/data/ingredients/*.yaml file
# (each may hold a single board mapping or a `boards:` list) and generates the
# docs/ingredients/ pages. To add a board, add an entry here (or drop in a new
# YAML file) and run `uv run poe gen`.
#
# Fields:
#   slug        stable id, used for the page anchor and cross-links (required)
#   name        display name (required)
#   category    one of: mainboard | power | actuator | sensor | utility (required)
#   function    short one-line function (required)
#   description longer prose for the board's section
#   size        "Big" (71 x 45.5 mm) | "Small" (48.5 x 45.5 mm) | "" (n/a)
#   components  key ICs / parts, list of strings
#   power       input/output notes
#   repo        link to the board's wiki / repo page
#   image       URL or docs-relative path to a board render/photo
#   kitspace    project key in the BeeHive repo's kitspace.yaml; pulls in the
#               Bill of materials + fabrication-file links. Run `uv run poe sync`
#               to refresh the vendored BOMs under data/kitspace/.

boards:
  # --- Mainboards ----------------------------------------------------------
  - slug: esp32-mainboard
    kitspace: central-hub
    name: ESP32 BeeHive mainboard
    category: mainboard
    function: Carries the ESP32 microcontroller and breaks out every pin.
    description: >
      The heart of the BeeHive system. Built around the ESP32 (8 digital lines,
      3 analog inputs, 2 I2C channels, 1 UART, plus SPI, Bluetooth and WiFi),
      it exposes all pins through the standard 4-pin JST daughter-board
      connectors and handles 12 V power management. Programmable in MicroPython
      or C++ (Arduino).
    size: ""
    components: [ESP32-WROOM, "12 V to 5 V regulator", JST-PH connectors]
    power: "12 V DC in; supplies 12 V and 5 V to daughter boards"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/Main-hub
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/central_hub/central_hub_3D.png?raw=true

  - slug: mikrobus-mainboard
    name: MikroBUS-compatible BeeHive mainboard
    category: mainboard
    function: ESP32 mainboard with added MikroBUS / Click Board compatibility.
    description: >
      Same ESP32 core as the original mainboard, plus connectors for the
      MikroBUS open standard — opening up MikroElektronika's ecosystem of 500+
      Click Boards while keeping MicroPython control. Serves as an integration
      example with an established third-party platform.
    size: ""
    components: [ESP32-WROOM, MikroBUS sockets, Qwiic connectors]
    power: "12 V DC in"
    repo: https://github.com/BeeHive-org/BeeHive

  # --- Power management ----------------------------------------------------
  - slug: 12v5a-breakout
    kitspace: 12V5A_breakout
    name: 12V5A breakout
    category: power
    function: Distributes 12 V / 5 A to other boards.
    description: >
      A barrel-jack input, a power LED indicator and nine connectors that fan
      12 V / 5 A out to the mainboard and daughter boards.
    size: ""
    components: [Barrel jack, Power LED, "9 × output connectors"]
    power: "12 V / 5 A in and out"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/12V5A-breakout
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/12V5A_breakout/12V5A_breakout_3D.png?raw=true

  - slug: 5v3a-breakout
    name: 5V3A breakout
    category: power
    function: Steps 12 V / 5 A down to 5 V / 3 A.
    description: >
      Converts 12 V / 5 A to 5 V / 3 A using an LM2596 regulator. Fed from either
      mainboard 12 V output; can be daisy-chained to another 5 V / 3 A breakout.
    size: ""
    components: [LM2596]
    power: "12 V / 5 A in; 5 V / 3 A out"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/5V3A-breakout
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/power_supply/power_supply_3D.png?raw=true

  - slug: 12v-24v-boost
    kitspace: 12_24_boost_converter
    name: 12V/24V boost converter
    category: power
    function: Boosts 12 V / 5 A up to 24 V / 1 A.
    description: >
      A 555-based step-up converter that provides up to 24 V / 1 A — used to
      power solenoids in "Spike & Hold" mode, or any other 24 V device. Powered
      from the mainboard or the 12V5A breakout.
    size: ""
    components: ["555 timer IC"]
    power: "12 V / 5 A in; 24 V / 1 A out"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/Boost-converter-12V-to-24V
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/12_24_boost_converter/12_24_boost_converter_3D.png?raw=true

  # --- Actuators -----------------------------------------------------------
  - slug: h-bridge-driver
    kitspace: hbridge_driver
    name: H-bridge driver
    category: actuator
    function: Drives DC motors and Peltier elements.
    description: >
      A full-bridge driver (2 n-channel + 2 p-channel MOSFETs driven by a TC4420)
      with a connector for a DS18B20 temperature sensor. A low-pass filter makes
      it Peltier-compatible. Output up to 12 V / 5 A.
    size: Big
    components: ["TC4420 driver", "n/p-channel MOSFETs", DS18B20 connector]
    power: "12 V / 5 A max output"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/H-bridge-driver
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/hbridge_driver/hbridge_driver_3D.png?raw=true

  - slug: switch-array
    kitspace: 8-switch-array
    name: Switch array
    category: actuator
    function: Switches many low-power loads (e.g. LEDs) over few pins.
    description: >
      Uses a 74HC595 shift register to control many components from few pins.
      Switched load voltage can vary from 5 to 12 V.
    size: ""
    components: ["74HC595 shift register"]
    power: "5–12 V switched"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/Switch-array
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/8_switch_array/8_switch_array_3D.png?raw=true

  - slug: high-power-switch-array
    kitspace: hp-led-switch
    name: High-power switch array
    category: actuator
    function: Switches power-demanding loads (e.g. high-power LEDs).
    description: >
      Based on a TC4427 driver and n-channel MOSFETs for switching
      power-hungry components at 12 V / 5 A, drawn from the mainboard or the
      12V5A breakout.
    size: ""
    components: ["TC4427 driver", "n-channel MOSFETs"]
    power: "12 V / 5 A"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/High-power-switch-array
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/hp_led_switch/hp_led_switch_3D.png?raw=true

  - slug: solenoid-control-board
    name: Solenoid control board
    category: actuator
    function: Controls solenoid valves (standard speed).
    description: >
      A "traditional" solenoid driver for applications that do not need the
      fastest opening times. Use the Spike & Hold board when sub-millisecond
      opening matters.
    size: ""
    components: [MOSFET driver]
    power: "12 V"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/Solenoid-control-board

  - slug: spike-and-hold-board
    name: Spike & Hold board
    category: actuator
    function: Drives solenoids in "Spike & Hold" mode for fast opening.
    description: >
      A purpose-built driver replicating the Lee Company "Spike & Hold" circuit,
      overdriving solenoids for opening times in the hundreds of microseconds
      (at the cost of solenoid lifetime). Pairs with the 12V/24V boost converter.
    size: ""
    components: ["Spike & Hold circuit"]
    power: "12 V / 24 V"
    repo: https://github.com/BeeHive-org/BeeHive/wiki/Spike&Hold-board

  # --- Sensors -------------------------------------------------------------
  - slug: gas-sensor
    kitspace: gas_sensor
    name: Gas sensor
    category: sensor
    function: Detects gas-related environmental variables.
    description: >
      Built around an MQ-6 gas sensor; swapping in another MQ-series sensor
      lets it detect different gases.
    size: ""
    components: ["MQ-6 (MQ-series) sensor"]
    repo: https://github.com/BeeHive-org/BeeHive/wiki/Gas-sensor
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/gas_sensor/gas_sensor_3d.png?raw=true

  - slug: humidity-temperature-sensor
    kitspace: hum_temp_sensor
    name: Humidity & temperature sensor
    category: sensor
    function: Monitors humidity and temperature.
    description: Compatible with both DHT11 and DHT22 sensors.
    size: ""
    components: [DHT11, DHT22]
    repo: https://github.com/BeeHive-org/BeeHive/wiki/Humidity-and-temperature-sensor
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/hum_temp_sensor/hum_temp_sensor_3d.png?raw=true

  - slug: ir-sensor-array
    name: IR sensor array
    category: sensor
    function: Hosts paired IR LEDs and phototransistors (e.g. nose-poke ports).
    description: >
      Accommodates 6 pairs of infrared LEDs and matching phototransistors —
      used for nose-poke detection and beam-break tracking with microsecond
      precision.
    size: ""
    components: ["6 × IR LED + phototransistor pairs"]
    repo: https://github.com/BeeHive-org/BeeHive/wiki/IR-sensor-array

  # --- Training ------------------------------------------------------------
  - slug: training-board
    kitspace: testing_board
    name: Training board
    category: training
    function: A teaching board covering the core electronic building blocks.
    description: >
      A board bringing together the modules a beginner needs to learn
      electronics and MicroPython: LEDs, push buttons, potentiometers, shift
      registers, rotary encoders, relays, and a temperature sensor. Together
      they cover digital input and output, analog input, and SPI communication.
      Paired with the guided exercises, it lets learners master coding and wiring
      one at a time, and doubles as a testbed for validating experiment logic
      before committing it to a real setup.
    size: ""
    components: [8-bit shift register + LED matrix, Push buttons, Potentiometers, Rotary encoders, Relay module, Digital temperature sensor]
    repo: https://github.com/BeeHive-org/BeeHive
    image: ""

  # --- Utilities -----------------------------------------------------------
  - slug: level-shifter
    name: Level shifter
    category: utility
    function: Bi-directional 5 V ↔ 3.3 V logic level translation.
    description: >
      A bi-directional level shifter (based on the BSS138 MOSFET, inspired by
      Adafruit's design) letting 5 V and 3.3 V devices communicate.
    size: ""
    components: ["BSS138 MOSFET"]
    repo: https://github.com/BeeHive-org/BeeHive/wiki/Level-shifter
    image: https://github.com/BeeHive-org/BeeHive/raw/master/hardware/PCBs/level_shifter/level_shifter_3D.png?raw=true
